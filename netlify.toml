[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/blog/your-technical-skills-arent-enough/*"
  to = "/blog/technical-communication-prep-framework/"
  status = 301

[[redirects]]
  from = "/blog/your-technical-skills-arent-enough"
  to = "/blog/technical-communication-prep-framework/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
